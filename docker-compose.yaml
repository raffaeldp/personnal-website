services:
  webapp:
    container_name: personnal-website
    image: ghcr.io/raffaeldp/personnal-website:master
    restart: always
    ports:
      - 127.0.0.1:4000:4000
    environment:
      # NEXT_PUBLIC_* vars are baked in at build time (see Dockerfile build args)
      - SANITY_REVALIDATE_SECRET=${SANITY_REVALIDATE_SECRET}
